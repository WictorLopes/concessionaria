<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concessionária Web - Cadastrar Venda</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="vendas.js"></script>
  </head>
  <body>
    <div id="loading" class="loading-overlay hidden">
      <div class="spinner"></div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="../index.html">Concessionária Web</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="../vendas/listar.html">Vendas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../concessionaria/listar.html">Concessionárias</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../fabricante/listar.html">Fabricantes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../veiculo/listar.html">Veículos</a>
            </li>
            <div id="listar-usuarios-container" style="display: none;">
              <li class="nav-item">
                <a class="nav-link" href="../usuario/listar.html">Usuários</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../relatorios/listar.html">Relatórios</a>
              </li>
            </div>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card-no-hover p-4">
            <h2 class="text-center mb-4">Cadastrar Venda</h2>
            <div id="geralError" class="text-center mb-3" style="display: none;"></div>
            <form id="formCadastroVenda">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="concessionaria" class="form-label">Concessionária</label>
                  <select class="form-select" id="concessionaria" required>
                    <option value="">Selecione uma concessionária</option>
                  </select>
                  <div id="concessionariaError" class="error-message"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="fabricante" class="form-label">Fabricante</label>
                  <select class="form-select" id="fabricante" required>
                    <option value="">Selecione um fabricante</option>
                  </select>
                  <div id="fabricanteError" class="error-message"></div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="veiculo" class="form-label">Veículo</label>
                  <select class="form-select" id="veiculo" required disabled>
                    <option value="">Selecione um veículo</option>
                  </select>
                  <div id="veiculoError" class="error-message"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="nomeCliente" class="form-label">Nome do Cliente</label>
                  <input type="text" class="form-control" id="nomeCliente" required />
                  <div id="nomeClienteError" class="error-message"></div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="cpf" class="form-label">CPF</label>
                  <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" maxlength="14" required />
                  <div id="cpfError" class="error-message"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="telefone" class="form-label">Telefone</label>
                  <input type="text" class="form-control" id="telefone" placeholder="(00) 00000-0000" maxlength="15" required />
                  <div id="telefoneError" class="error-message"></div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="dataVenda" class="form-label">Data da Venda</label>
                  <input type="date" class="form-control" id="dataVenda" required />
                  <div id="dataVendaError" class="error-message"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="precoVenda" class="form-label">Preço de Venda</label>
                  <input type="text" class="form-control" id="precoVenda" required />
                  <div id="precoVendaError" class="error-message"></div>
                </div>
              </div>
              <div class="d-flex justify-content-between">
                <a href="listar.html" class="btn btn-secondary">Voltar</a>
                <button type="submit" class="btn btn-success">Cadastrar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center">
      <p>© 2025 Concessionária Web. Todos os direitos reservados. Backend Offline, site funcionando apenas o visual.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Verificar autenticação e permissões
      document.addEventListener("DOMContentLoaded", function () {
        const user = verificarAutenticacao();
        if (!user) {
          return;
        }

        const tipo = localStorage.getItem("tipo");
        const listarContainer = document.getElementById("listar-usuarios-container");
        if (tipo === "Administrador" || tipo === "Gerente") {
          listarContainer.style.display = "flex";
        } else {
          listarContainer.style.display = "none";
        }

        // Máscara para preço de venda
        const precoVendaInput = document.getElementById("precoVenda");
        precoVendaInput.addEventListener("input", function () {
          let value = this.value.replace(/\D/g, "");
          if (value.length === 0) {
            this.value = "";
            return;
          }
          value = (parseInt(value) / 100).toFixed(2).replace(".", ",");
          value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          this.value = value;
        });
      });
    </script>
  </body>
</html>
